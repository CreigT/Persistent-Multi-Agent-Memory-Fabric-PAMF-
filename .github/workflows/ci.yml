name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Import check
        run: python -c "from src.pamf.app import app; print(app.title)"
      - name: OpenAPI present
        run: test -s openapi/openapi.yaml
      - name: MCP manifest valid
        run: python -c "import json; json.load(open('mcp/pamf.mcp.json'))"
      - name: Helm lint
        uses: azure/setup-helm@v4
      - name: Helm template
        run: helm template pamf helm/pamf > /tmp/pamf.yaml && test -s /tmp/pamf.yaml
      - name: API tests
        run: pytest -q tests
  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pamf:ci .
