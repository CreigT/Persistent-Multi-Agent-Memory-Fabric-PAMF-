apiVersion: apps/v1
kind: Deployment
metadata:
  name: pamf
  labels:
    app.kubernetes.io/name: pamf
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: pamf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pamf
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: memory
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PAMF_STORE
              value: {{ .Values.env.PAMF_STORE | quote }}
            - name: PAMF_FROZEN
              value: {{ .Values.freeze.enabled | quote }}
          readinessProbe:
            httpGet:
              path: /v1/memory/health
              port: http
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /v1/memory/health
              port: http
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: pamf
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: pamf
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pamf
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pamf
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - {}
{{- end }}
