services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pamf
      POSTGRES_PASSWORD: pamf
      POSTGRES_DB: pamf
    ports:
      - "5432:5432"
    volumes:
      - pamf_pg:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pamf -d pamf"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PAMF_STORE: postgres
      DATABASE_URL: postgresql://pamf:pamf@db:5432/pamf
    depends_on:
      db:
        condition: service_healthy

volumes:
  pamf_pg:
